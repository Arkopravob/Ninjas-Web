<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <div class="container">
        <!-- The Form -->
        <form id="contactForm">
            <h1>Contact Us</h1>

            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>

        <!-- The Confirmation Message -->
        <div id="confirmationMessage">
            <h2>Thank You!</h2>
            <p>Your message has been received. We will get back to you shortly.</p>
        </div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function (event) {
            // 1. Prevent the form's default submission behavior
            event.preventDefault();

            // 2. Get the form data
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            // --- VALIDATION ---
            // HTML 'required' attribute handles basic validation.
            // You can add more complex validation here if needed.
            if (name.trim() === '' || email.trim() === '' || message.trim() === '') {
                alert('Please fill out all fields.');
                return; // Stop the function
            }

            // --- DATA STORAGE ---
            // Create an object to hold the form data
            const formData = {
                name: name,
                email: email,
                message: message,
                submittedAt: new Date().toLocaleString()
            };

            // For this basic example, we'll store the data in the browser's localStorage.
            // In a real-world application, you would send this to a server.
            try {
                // Get existing submissions or initialize an empty array
                let submissions = JSON.parse(localStorage.getItem('contactSubmissions')) || [];
                // Add the new submission
                submissions.push(formData);
                // Save back to localStorage
                localStorage.setItem('contactSubmissions', JSON.stringify(submissions));
            } catch (error) {
                console.error('Could not save to localStorage', error);
            }

            // --- DISPLAY CONFIRMATION ---
            // Hide the form
            document.getElementById('contactForm').style.display = 'none';
            // Show the confirmation message
            document.getElementById('confirmationMessage').style.display = 'block';

        });
    </script>

</body>

</html>
